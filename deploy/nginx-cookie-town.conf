# Cookie Town 反向代理（Nginx 备选方案）
# 若不用 Caddy，改用本文件：放到 /etc/nginx/conf.d/cookie-town.conf，
# 然后 nginx -t && systemctl reload nginx，再用 certbot 追加 HTTPS：
#   certbot --nginx -d cookie-town.cn -d www.cookie-town.cn
# certbot 会自动新增 443 server 块并把 80 改为跳转。

server {
    listen 80;
    listen [::]:80;
    server_name cookie-town.cn www.cookie-town.cn;

    # 上传体积上限，需 >= Spring 的 spring.servlet.multipart.max-request-size(20MB)
    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 60s;
    }
}
