<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>曲奇小镇 · 登录</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="site-header">
    <h1 class="site-title"><a href="index.html">曲奇小镇</a></h1>
    <nav class="auth-nav">
        <a href="register.html">没有账号？去注册</a>
    </nav>
</header>

<main>
    <section class="form-section">
        <h2>登录</h2>
        <!--
          磁贴式表单：data-endpoint / data-method 供后续 JS 通用接线。
          当前 action="#" 仅为占位，未接入 JS 时不会真正提交。
        -->
        <form class="tile-form" id="login-form" action="#" method="post"
              data-endpoint="/api/auth/login" data-method="POST">
            <div class="tile-field">
                <label for="login-name">用户名</label>
                <input id="login-name" name="name" type="text" autocomplete="username" required>
            </div>
            <div class="tile-field">
                <label for="login-password">密码</label>
                <input id="login-password" name="password" type="password" autocomplete="current-password" required>
            </div>
            <div class="tile-actions">
                <button class="tile-action" type="submit">登录</button>
                <a class="tile-action tile-action-secondary" href="index.html">返回</a>
            </div>
            <!-- 登录结果提示区：后续由 JS 填充（成功存 token / 失败提示） -->
            <p id="login-message" class="form-message" role="status"></p>
        </form>
    </section>
</main>

<footer class="site-footer">
    <p>曲奇小镇 · Minecraft 社区网站</p>
</footer>
<script src="js/app.js"></script>
</body>
</html>
