<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>曲奇小镇 · 注册</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="site-header">
    <h1 class="site-title"><a href="index.html">曲奇小镇</a></h1>
    <nav class="auth-nav">
        <a href="login.html">已有账号？去登录</a>
    </nav>
</header>

<main>
    <section class="form-section">
        <h2>注册</h2>
        <!--
          磁贴式表单：注册端点 POST /api/users。
          用户名建议与 Minecraft 账户一致（3-16 位）；密码 6-18 位字符串/数字/非空白 ASCII。
          新注册用户默认为 Visitor（访客，只读），需管理员晋升为 Common 才能发布内容。
        -->
        <form class="tile-form" id="register-form" action="#" method="post"
              data-endpoint="/api/users" data-method="POST">
            <div class="tile-field">
                <label for="register-name">用户名</label>
                <input id="register-name" name="name" type="text" minlength="3" maxlength="16"
                       autocomplete="username" required>
                <small class="field-hint">3-16 位，建议与 Minecraft 账户一致</small>
            </div>
            <div class="tile-field">
                <label for="register-password">密码</label>
                <input id="register-password" name="password" type="password" minlength="6" maxlength="18"
                       autocomplete="new-password" required>
                <small class="field-hint">6-18 位</small>
            </div>
            <div class="tile-actions">
                <button class="tile-action" type="submit">注册</button>
                <a class="tile-action tile-action-secondary" href="index.html">返回</a>
            </div>
            <p id="register-message" class="form-message" role="status"></p>
        </form>
    </section>
</main>

<footer class="site-footer">
    <p>曲奇小镇 · Minecraft 社区网站</p>
</footer>
<script src="js/app.js"></script>
</body>
</html>
