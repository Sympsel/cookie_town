<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>曲奇小镇 · 公告</title>
    <!-- 后续接入样式：<link rel="stylesheet" href="css/style.css"> -->
</head>
<body>
<header class="site-header">
    <h1 class="site-title"><a href="index.html">曲奇小镇</a></h1>
    <nav class="auth-nav">
        <span id="session-status" class="session-status">未登录</span>
        <a href="index.html">返回首页</a>
    </nav>
</header>

<main>
    <section class="list-section">
        <h2>公告列表</h2>
        <!-- 列表占位：后续由 JS 调用 GET /api/notices 渲染成磁贴 -->
        <div class="tile-grid" id="notice-list" data-endpoint="/api/notices">
            <p class="empty-hint">列表将在接入 JS 后加载。</p>
        </div>
    </section>

    <section class="form-section">
        <h2>发布公告</h2>
        <!--
          磁贴式表单：POST /api/notices，仅管理员（Admin）可发布/修改/删除。
          非管理员访问会被后端拦截返回 403；后续 JS 可根据登录权限决定是否显示此表单。
        -->
        <form class="tile-form" id="notice-create-form" action="#" method="post"
              data-endpoint="/api/notices" data-method="POST" data-require-permission="Admin">
            <div class="tile-field">
                <label for="notice-title">标题</label>
                <input id="notice-title" name="title" type="text" required>
            </div>
            <div class="tile-field">
                <label for="notice-content">内容</label>
                <textarea id="notice-content" name="content" rows="5" required></textarea>
            </div>
            <div class="tile-actions">
                <button class="tile-action" type="submit">发布</button>
            </div>
            <p id="notice-message" class="form-message" role="status"></p>
        </form>
    </section>
</main>

<footer class="site-footer">
    <p>曲奇小镇 · Minecraft 社区网站</p>
</footer>
<script src="js/app.js"></script>
</body>
</html>
