<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>曲奇小镇 · 留言板</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="site-header">
    <h1 class="site-title"><a href="index.html">曲奇小镇</a></h1>
    <nav class="auth-nav">
        <span id="session-status" class="session-status">未登录</span>
        <a href="index.html">返回首页</a>
    </nav>
</header>

<main>
    <section class="list-section">
        <h2>留言列表</h2>
        <!-- 列表占位：后续由 JS 调用 GET /api/message-boards 渲染成磁贴 -->
        <div class="tile-grid" id="messageboard-list">
            <p class="empty-hint">列表将在接入 JS 后加载。</p>
        </div>
    </section>

    <section class="form-section">
        <details class="create-panel">
            <summary class="tile-action create-toggle">＋ 发表留言</summary>
            <form class="tile-form" id="messageboard-create-form" action="#" method="post"
                  data-endpoint="/api/message-boards" data-method="POST">
                <div class="tile-field">
                    <label for="messageboard-content">留言内容</label>
                    <textarea id="messageboard-content" name="content" rows="4" required></textarea>
                </div>
                <div class="tile-field">
                    <label for="messageboard-score">评分</label>
                    <select id="messageboard-score" name="score" required>
                        <option value="Perfect">极好（5）</option>
                        <option value="Good">好（4）</option>
                        <option value="Average">一般（3）</option>
                        <option value="Bad">差（2）</option>
                        <option value="Terrible">极差（1）</option>
                    </select>
                </div>
                <div class="tile-actions">
                    <button class="tile-action" type="submit">发表</button>
                </div>
                <p id="messageboard-message" class="form-message" role="status"></p>
            </form>
        </details>
    </section>
</main>

<footer class="site-footer">
    <p>曲奇小镇 · Minecraft 社区网站</p>
</footer>
<script src="js/app.js"></script>
</body>
</html>
