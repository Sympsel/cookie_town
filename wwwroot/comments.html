<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>曲奇小镇 · 评论</title>
    <!-- 后续接入样式：<link rel="stylesheet" href="css/style.css"> -->
</head>
<body>
<header class="site-header">
    <h1 class="site-title"><a href="index.html">曲奇小镇</a></h1>
    <nav class="auth-nav">
        <span id="session-status" class="session-status">未登录</span>
        <a href="index.html">返回首页</a>
    </nav>
</header>

<main>
    <section class="list-section">
        <h2>评论列表</h2>
        <!-- 列表占位：后续由 JS 调用 GET /api/comments 渲染成磁贴 -->
        <div class="tile-grid" id="comment-list" data-endpoint="/api/comments">
            <p class="empty-hint">列表将在接入 JS 后加载。</p>
        </div>
    </section>

    <section class="form-section">
        <details class = "create-panel">
            <summary class="tile-action create-toggle"> + 发表评论</summary>
            <form class="tile-form" id="comment-create-form" action="#" method="post"
                  data-endpoint="/api/comments" data-method="POST">
                <div class="tile-field">
                    <label for="comment-content">评论内容</label>
                    <textarea id="comment-content" name="content" rows="4" required></textarea>
                </div>
                <div class="tile-field">
                    <label for="comment-parent">父评论 UUID（可选，回复时填写）</label>
                    <input id="comment-parent" name="parentUuid" type="text" placeholder="留空表示主评论">
                </div>
                <div class="tile-actions">
                    <button class="tile-action" type="submit">发表</button>
                </div>
                <p id="comment-message" class="form-message" role="status"></p>
            </form>
        </details>
    </section>
</main>

<footer class="site-footer">
    <p>曲奇小镇 · Minecraft 社区网站</p>
</footer>
<script src="js/app.js"></script>
</body>
</html>
