server:
  port: 8080

spring:
  application:
    name: cookie-town
    servlet:
      multipart:
        max-file-size: 5MB
        max-request-size: 20MB
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

# JWT 认证配置
# secret 必须 >= 32 字节（256 位）用于 HS256 签名，通过环境变量 JWT_SECRET 注入，切勿硬编码提交
jwt:
  secret: ${JWT_SECRET:}
  expiration: 86400000  # token 有效期，单位毫秒（默认 24 小时）

app:
  # 外部配置目录：存放 config.json（开发者名单 / 首个管理员 / 主镇 / 分页 / 开发模式的唯一真源）。
  # 相对于应用工作目录（与 wwwroot/、uploads/ 一致），可用环境变量 CONFIG_DIR 覆盖。
  config-dir: ${CONFIG_DIR:./config}
  # 开发者标签名：config.json 的 developers 名单会在启动时同步该标签（名单内打标、名单外撤标）。
  # 拥有该标签的用户视为「开发者」，可全权修复其它玩家的账户信息（用户名 / 简介 / 重置密码）。
  developer-tag: ${DEVELOPER_TAG:开发者}
