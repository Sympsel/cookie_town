server:
  port: 8080

spring:
  application:
    name: cookie-town
    servlet:
      multipart:
        max-file-size: 5MB
        max-request-size: 20MB
  datasource:
    url: jdbc:mysql://localhost:3306/cookie_town?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

# JWT 认证配置
# secret 必须 >= 32 字节（256 位）用于 HS256 签名，通过环境变量 JWT_SECRET 注入，切勿硬编码提交
jwt:
  secret: ${JWT_SECRET:}
  expiration: 86400000  # token 有效期，单位毫秒（默认 24 小时）

app:
  bootstrap-admin:
    username: ${ADMIN_USERNAME}
  # 特权标签白名单（逗号分隔）：拥有其中任一标签的用户视为「开发者」，
  # 可全权修复其它玩家的账户信息（用户名 / 简介 / 重置密码）。
  # 注意：管理员角色本身不再具备修改他人账户信息的权力，账户修复统一交由开发者。
  privileged-tags: ${PRIVILEGED_TAGS:开发者,站长}
